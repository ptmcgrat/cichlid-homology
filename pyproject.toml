[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cichlid-homology"
version = "0.21.1"
description = "Homology decider of the cichlid protein phylogeny resource (project 3)"
requires-python = ">=3.11"
dependencies = ["cichlid-coordinator>=0.14,<0.15"]

[project.optional-dependencies]
dev = ["pytest"]
figures = ["matplotlib>=3.5"]

[project.scripts]
cichlid-homology = "cichlid_homology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
